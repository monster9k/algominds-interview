name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  server:
    name: Server — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Prisma 7 driver-adapter setup — schema.prisma has no datasource url,
      # so `generate` needs no DATABASE_URL/DB connection.
      - run: npx prisma generate

      - run: npm run lint

      - run: npm run test -- --ci

      - run: npm run build

  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: http://localhost:3001
      VITE_SOCKET_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build
